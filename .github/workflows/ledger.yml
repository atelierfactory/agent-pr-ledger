name: Agent PR ledger

# Output goes to the job summary only. This workflow posts nothing to PRs or issues.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly, 1st of the month

permissions:
  contents: read
  pull-requests: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Build ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 src/ledger.py "${GITHUB_REPOSITORY}" 300 --lang en > ledger.txt
          cat ledger.txt
      - name: Write job summary
        run: |
          {
            echo '```'
            cat ledger.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
