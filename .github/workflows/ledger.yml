name: Agent PR ledger

# Output goes to the job summary. This workflow posts nothing to PRs or issues.
#
# Three modes. The default sends nothing and contacts nothing but the GitHub API.
#
#   send: "false", preview: "false"  (default) — fully offline apart from GitHub
#   preview: "true"                  — fetches ONE public file to show what you would get back
#   send: "true"                     — transmits counts + a GitHub OIDC token. Your repository
#                                      name is not stored; only aggregates are published
#   link: "true"                     — (with send) stores under a pseudonymous identifier so your
#                                      submissions connect over time. See "Why link?" in the README
#
# Setting both preview and send to "true" fails the job rather than picking one.
#
# The line below lives in your repository and your git history, not ours.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly, 1st of the month

permissions:
  contents: read
  pull-requests: read
  # id-token: write   # uncomment only if you set send: true below

env:
  send: "false"
  preview: "false"
  link: "false"

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Build ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ env.preview }}" = "true" ] && [ "${{ env.send }}" = "true" ]; then
            echo "error: preview and send are mutually exclusive" >&2
            exit 1
          fi
          LINK=""
          [ "${{ env.link }}" = "true" ] && LINK=--link
          MODE=--dry-run
          [ "${{ env.preview }}" = "true" ] && MODE=--preview
          [ "${{ env.send }}" = "true" ] && MODE=--send
          python3 src/ledger.py "${GITHUB_REPOSITORY}" 300 --lang en $MODE $LINK > ledger.txt
          cat ledger.txt
      - name: Write job summary
        run: |
          { echo '```'; cat ledger.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
